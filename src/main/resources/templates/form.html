<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Form</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      .form-row {
        margin-bottom: 12px;
      }
      label {
        display: inline-block;
        width: 120px;
      }
    </style>
  </head>
  <body>
    <h1
      th:text="${formMode} == 'edit' ? 'Chinh Sua Sinh Vien' : 'Them Sinh Vien'"
    >
      Student Form
    </h1>

    <form
      th:action="${formMode} == 'edit' ? @{'/students/' + ${student.id}} : @{/students}"
      th:object="${student}"
      method="post"
    >
      <div class="form-row">
        <label for="id">ID</label>
        <input
          type="text"
          id="id"
          th:field="*{id}"
          th:readonly="${formMode} == 'edit'"
          required
        />
      </div>

      <div class="form-row">
        <label for="name">Ten</label>
        <input type="text" id="name" th:field="*{name}" required />
      </div>

      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" required />
      </div>

      <div class="form-row">
        <label for="age">Tuoi</label>
        <input type="number" id="age" th:field="*{age}" min="0" required />
      </div>

      <button type="submit">Luu</button>
      <a th:href="@{/students}" style="margin-left: 8px">Huy</a>
    </form>
  </body>
</html>
